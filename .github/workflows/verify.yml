name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify bundle
        run: npm run verify
      - name: Check publish payload
        run: npm pack --dry-run

  # Geometry is a promise this plugin makes (no overlap, no dead band, no scroll),
  # and only a real layout engine can check it. macOS runners ship Chrome; the check
  # skips itself when no browser is found, so it can never block a release on a
  # missing dependency.
  verify-ui:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Measure the panel in a real browser
        run: npm run verify:ui
